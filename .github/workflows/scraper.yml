name: Minero de Clientes LogiQuote

on:
  schedule:
    # Se ejecuta solo cada madrugada a las 02:00 AM (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Te pone un botón manual en GitHub por si quieres forzar la máquina ahora mismo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v3
        
      - name: Preparar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar motores
        run: pip install -r requirements.txt
        
      - name: Arrancar Extracción
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py
